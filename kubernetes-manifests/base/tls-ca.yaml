kind: Service
apiVersion: v1
metadata:
  name: tls-ca
spec:
  selector:
    app: blockchain
    role: tls-ca
  ports:
    - name: tcp-7054
      port: 7054
      protocol: TCP

---

kind: Deployment
apiVersion: apps/v1
metadata:
  name: tls-ca
  labels:
    app: blockchain
    role: tls-ca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockchain
      role: tls-ca
  template:
    metadata:
      labels:
        app: blockchain
        role: tls-ca
    spec:
      volumes:
        - name: nfs
          persistentVolumeClaim:
            claimName: nfs
      containers:
        - name: tls-ca
          image: hyperledger/fabric-ca:1.4.9
          args:
            - sh
            - -c
            - fabric-ca-server start -b tls-admin:tls-adminpw -d
          env:
            - name: FABRIC_CA_HOME
              value: /etc/hyperledger/fabric-ca-server
            - name: FABRIC_CA_SERVER_CA_CERTFILE
              value: /etc/hyperledger/fabric-ca-server-config/tls.ca.example.com-cert.pem
            - name: FABRIC_CA_SERVER_CA_KEYFILE
              value: /etc/hyperledger/fabric-ca-server-config/priv_sk
            - name: FABRIC_CA_SERVER_CA_NAME
              value: ca.example.com
            - name: FABRIC_CA_SERVER_TLS_ENABLED
              value: "true"
          ports:
            - containerPort: 7054
          volumeMounts:
            - name: nfs
              mountPath: /etc/hyperledger/fabric-ca-server-config
              subPath: crypto-config/externalServices/tls.ca/example.com/tlsca/
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","rm -rf /etc/hyperledger/fabric-ca-server-config/*"]

