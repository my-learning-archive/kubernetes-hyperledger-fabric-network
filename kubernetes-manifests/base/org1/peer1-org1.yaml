kind: Service
apiVersion: v1
metadata:
  name: peer1-org1
spec:
  selector:
    app: blockchain
    role: peer1-org1
  ports:
    - name: tcp-7051
      port: 7051
      protocol: TCP

---

kind: Deployment
apiVersion: apps/v1
metadata:
  name: peer1-org1
  labels:
    app: blockchain
    role: peer1-org1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockchain
      role: peer1-org1
  template:
    metadata:
      labels:
        app: blockchain
        role: peer1-org1
    spec:
      volumes:
        - name: nfs
          persistentVolumeClaim:
            claimName: nfs
        - name: external-builder-detect
          configMap:
            name: builders-config
            items:
              - key: detect
                path: detect
                mode: 0544
        - name: external-builder-build
          configMap:
            name: builders-config
            items:
              - key: build
                path: build
                mode: 0544
        - name: external-builder-release
          configMap:
            name: builders-config
            items:
              - key: release
                path: release
                mode: 0544
      containers:
        - name: peer1-org1
          image: hyperledger/fabric-peer:2.4.6
          workingDir: /opt/gopath/src/github.com/hyperledger/fabric
          args:
            - sh
            - -c
            - peer node start
          env:
            - name: CORE_PEER_ID
              value: peer1-org1
            - name: FABRIC_LOGGING_SPEC
              value: INFO
            - name: CORE_PEER_TLS_ENABLED
              value: 'true'
            - name: CORE_PEER_TLS_CERT_FILE
              value: /etc/hyperledger/fabric/tls/server.crt
            - name: CORE_PEER_TLS_KEY_FILE
              value: /etc/hyperledger/fabric/tls/server.key
            - name: CORE_PEER_TLS_ROOTCERT_FILE
              value: /etc/hyperledger/fabric/tls/ca.crt
            - name: CORE_PEER_TLS_CLIENTAUTHREQUIRED
              value: 'false'
            - name: CORE_PEER_TLS_CLIENTROOTCAS_FILES
              value: /etc/hyperledger/fabric/tls/ca.crt
            - name: CORE_PEER_TLS_CLIENTCERT_FILE
              value: /etc/hyperledger/fabric/tls/server.crt
            - name: CORE_PEER_TLS_CLIENTKEY_FILE
              value: /etc/hyperledger/fabric/tls/server.key
            - name: CORE_PEER_LOCALMSPID
              value: Org1MSP            
            - name: CORE_PEER_MSPCONFIGPATH
              value: /etc/hyperledger/fabric/msp/
            - name: CORE_PEER_ADDRESS
              value: peer1-org1:7051
            - name: CORE_PEER_GOSSIP_EXTERNALENDPOINT
              value: peer1-org1:7051
            - name: CORE_PEER_CHAINCODELISTENADDRESS
              value: 0.0.0.0:7052
            - name: CORE_LEDGER_STATE_STATEDATABASE
              value: CouchDB
            - name: CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS
              value: localhost:5984 # because couchDB is running in the same pod
            - name: CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME
              value: couchdb-peer1-org1-un
            - name: CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD
              value: couchdb-peer1-org1-pw
            - name: CORE_LEDGER_STATE_COUCHDBCONFIG_MAXRETRIESONSTARTUP
              value: '30'
            - name: CORE_CHAINCODE_EXTERNALBUILDERS
              value: '[{name: external-builder, path: /builders/external}]'
          ports:
            - containerPort: 7051
            - containerPort: 7053
          volumeMounts:
            - name: nfs
              mountPath: /etc/hyperledger/fabric/msp
              subPath: crypto-config/peerOrganizations/org1/peers/peer1-org1/msp
            - name: nfs
              mountPath: /etc/hyperledger/fabric/tls
              subPath: crypto-config/peerOrganizations/org1/peers/peer1-org1/tls
            - name: external-builder-detect
              mountPath: /builders/external/bin/detect
              subPath: detect
            - name: external-builder-build
              mountPath: /builders/external/bin/build
              subPath: build
            - name: external-builder-release
              mountPath: /builders/external/bin/release
              subPath: release
        - name: couchdb-peer1-org1
          image: hyperledger/fabric-couchdb
          env:
            - name: COUCHDB_USER
              value: couchdb-peer1-org1-un
            - name: COUCHDB_PASSWORD
              value: couchdb-peer1-org1-pw
          ports:
            - containerPort: 5984